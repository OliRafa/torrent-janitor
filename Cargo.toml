[package]
name = "torrent-janitor"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
description = "Keeps qBittorrent queues healthy for Sonarr and Radarr"
publish = false

[dependencies]
axum = { version = "0.8.9", default-features = false, features = ["http1", "tokio"] }
globset = "0.4.21"
humantime-serde = "1.1.1"
prometheus-client = { version = "0.25.1", default-features = false }
regex = "1.13.1"
reqwest = { version = "0.13.5", default-features = false, features = ["form", "json", "query"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "time", "signal", "net"] }
toml = "1.1.8"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["fmt", "json", "env-filter", "std"] }

[dev-dependencies]
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "time", "signal", "net", "test-util"] }
wiremock = "0.6.5"
